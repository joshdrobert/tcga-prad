name: CI & Scientific Audit

on:
  push:
    branches: [main, "audit/**", "research/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas scikit-learn lifelines matplotlib pytest

      - name: Run test suite
        run: |
          PYTHONPATH=. pytest tests/ -v -m "not playwright"

      - name: Run conference claims audit
        run: |
          python scripts/audit_conference_claims.py
